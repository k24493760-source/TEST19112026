# Интерфейс отдаёт FastAPI (Jinja2 + /static). Отдельного frontend-контейнера нет.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-most}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-most}
      POSTGRES_DB: ${POSTGRES_DB:-most_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - most

  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-most}:${POSTGRES_PASSWORD:-most}@db:5432/${POSTGRES_DB:-most_db}
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER:-most}:${POSTGRES_PASSWORD:-most}@db:5432/${POSTGRES_DB:-most_db}
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
      - hfcache:/home/most/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - most

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-most}:${POSTGRES_PASSWORD:-most}@db:5432/${POSTGRES_DB:-most_db}
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER:-most}:${POSTGRES_PASSWORD:-most}@db:5432/${POSTGRES_DB:-most_db}
    volumes:
      - appdata:/app/data
      - hfcache:/home/most/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - most

networks:
  most:

volumes:
  pgdata:
  appdata:
  hfcache:
